name: Docs

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs Material
        run: python -m pip install -r docs/requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  wiki-preview:
    name: Generate wiki pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate wiki pages
        shell: pwsh
        run: ./scripts/Sync-Wiki.ps1 -OutputPath wiki-out

      - name: Upload wiki pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: wiki-pages
          path: wiki-out
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  wiki:
    name: Sync GitHub wiki
    if: github.event_name != 'pull_request'
    needs: wiki-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check wiki token
        id: wiki-token
        shell: pwsh
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIKI_TOKEN)) {
            Write-Host 'WIKI_TOKEN secret is not set; skipping wiki synchronization.'
            'available=false' >> $env:GITHUB_OUTPUT
          } else {
            'available=true' >> $env:GITHUB_OUTPUT
          }

      - name: Download generated wiki pages
        if: steps.wiki-token.outputs.available == 'true'
        uses: actions/download-artifact@v8
        with:
          name: wiki-pages
          path: wiki-out

      - name: Publish wiki
        if: steps.wiki-token.outputs.available == 'true'
        shell: pwsh
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          $wikiUrl = "https://x-access-token:$env:WIKI_TOKEN@github.com/${{ github.repository }}.wiki.git"
          git clone --depth 1 $wikiUrl wiki-repo
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not clone the wiki repository. Create the first wiki page in the web UI and try again.'
          }

          Get-ChildItem -LiteralPath wiki-repo -Force |
            Where-Object { $_.Name -ne '.git' } |
            Remove-Item -Recurse -Force

          Copy-Item -Path (Join-Path 'wiki-out' '*') -Destination 'wiki-repo' -Recurse -Force

          git -C wiki-repo config user.name 'github-actions[bot]'
          git -C wiki-repo config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C wiki-repo add -A

          if (git -C wiki-repo status --porcelain) {
            git -C wiki-repo commit -m 'docs: sync wiki from documentation'
            git -C wiki-repo push
          } else {
            Write-Host 'Wiki is already up to date.'
          }
