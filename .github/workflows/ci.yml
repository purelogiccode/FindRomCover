name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CSharp_FindRomCover.sln

      - name: Build
        run: dotnet build CSharp_FindRomCover.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CSharp_FindRomCover.sln --configuration Release --no-build --verbosity normal
