name: Release

on:
  push:
    tags:
      - 'release_*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag and project versions
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $version = $tag -replace '^release_', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '$tag' must match 'release_<major>.<minor>.<patch>'."
          }

          function Get-MSBuildProperty([string]$Path, [string]$Name) {
            [xml]$project = Get-Content -LiteralPath $Path
            $node = $project.SelectSingleNode("/Project/PropertyGroup/$Name")
            if ($null -eq $node -or [string]::IsNullOrWhiteSpace($node.InnerText)) {
              throw "Property '$Name' is missing from $Path."
            }
            return $node.InnerText.Trim()
          }

          $checks = @(
            @{ Path = 'FindRomCover/FindRomCover.csproj'; Name = 'Version' },
            @{ Path = 'FindRomCover/FindRomCover.csproj'; Name = 'AssemblyVersion' },
            @{ Path = 'FindRomCover/FindRomCover.csproj'; Name = 'FileVersion' },
            @{ Path = 'FindRomCover.Tests/FindRomCover.Tests.csproj'; Name = 'AssemblyVersion' },
            @{ Path = 'FindRomCover.Tests/FindRomCover.Tests.csproj'; Name = 'FileVersion' }
          )

          foreach ($check in $checks) {
            $actual = Get-MSBuildProperty -Path $check.Path -Name $check.Name
            if ($actual -ne $version) {
              throw "$($check.Name) in $($check.Path) is '$actual', but tag '$tag' expects '$version'. Bump the project files before tagging."
            }
            Write-Host "$($check.Path): $($check.Name) = $actual"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

  test:
    name: Test release commit
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore CSharp_FindRomCover.sln

      - name: Build
        run: dotnet build CSharp_FindRomCover.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test CSharp_FindRomCover.sln --configuration Release --no-build --verbosity normal

  build:
    name: Build ${{ matrix.rid }}
    needs: [ validate, test ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Publish framework-dependent single file
        run: >
          dotnet publish FindRomCover/FindRomCover.csproj --configuration Release
          --runtime ${{ matrix.rid }} --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ needs.validate.outputs.version }}
          -p:AssemblyVersion=${{ needs.validate.outputs.version }}
          -p:FileVersion=${{ needs.validate.outputs.version }}

      - name: Stage bundle contents
        shell: pwsh
        run: |
          $publishDir = "FindRomCover/bin/Release/net10.0/${{ matrix.rid }}/publish"
          if (-not (Test-Path -LiteralPath $publishDir)) {
            throw "Publish folder not found: $publishDir"
          }
          $stageDir = "bundle-stage/${{ matrix.rid }}"
          if (Test-Path -LiteralPath $stageDir) { Remove-Item -LiteralPath $stageDir -Recurse -Force }
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item -Path (Join-Path $publishDir '*') -Destination $stageDir -Recurse -Force
          Copy-Item -LiteralPath 'LICENSE.txt' -Destination $stageDir -Force
          Copy-Item -LiteralPath 'README.md' -Destination $stageDir -Force
          Copy-Item -LiteralPath 'WhatsNew.md' -Destination $stageDir -Force
          Get-ChildItem -Path $stageDir -Recurse -Include '*.pdb' -Force | Remove-Item -Force
          Get-ChildItem -LiteralPath $stageDir -Force |
            Format-Table Name, Length -AutoSize |
            Out-String -Width 200 |
            Write-Host

      - name: Create bundle archive
        shell: pwsh
        run: |
          $tag = '${{ needs.validate.outputs.tag }}'
          $zipName = "${tag}_${{ matrix.rid }}.zip"
          $zipPath = Join-Path (Get-Location).Path $zipName
          $stageDir = "bundle-stage/${{ matrix.rid }}"
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }

          if ($IsWindows) {
            Compress-Archive -Path (Join-Path $stageDir '*') -DestinationPath $zipPath
          }
          else {
            # The zip CLI preserves the executable bit, which Compress-Archive
            # does not store on Unix runners.
            & chmod +x (Join-Path $stageDir 'FindRomCover')
            Push-Location $stageDir
            try {
              & zip -r -q $zipPath .
              if ($LASTEXITCODE -ne 0) { throw "zip failed for $zipName" }
            }
            finally {
              Pop-Location
            }
          }

          Get-Item -LiteralPath $zipPath |
            Format-Table Name, Length -AutoSize |
            Out-String -Width 200 |
            Write-Host

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.rid }}
          path: ${{ needs.validate.outputs.tag }}_${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [ validate, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download bundle artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          merge-multiple: true
          path: assets

      - name: Write release notes
        shell: pwsh
        run: |
          $tag = '${{ needs.validate.outputs.tag }}'
          $version = '${{ needs.validate.outputs.version }}'

          # Put the version's own "What's New" section into the release body instead of
          # merely linking to WhatsNew.md. Fall back to a changelog link only when the
          # section for the tagged version cannot be found.
          $notes = $null
          $lines = @(Get-Content -LiteralPath 'WhatsNew.md' -Encoding UTF8)
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match ('^#\s+FindRomCover\s+' + [regex]::Escape($version) + '(\s|$)')) {
              $start = $i
              break
            }
          }
          if ($start -ge 0) {
            $end = $lines.Count
            for ($i = $start + 1; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^#\s+FindRomCover\s') {
                $end = $i
                break
              }
            }
            $section = @($lines[$start..($end - 1)])
            while ($section.Count -gt 0 -and ($section[-1] -eq '---' -or [string]::IsNullOrWhiteSpace($section[-1]))) {
              $section = if ($section.Count -gt 1) { @($section[0..($section.Count - 2)]) } else { @() }
            }
            if ($section.Count -gt 0) { $notes = $section -join [Environment]::NewLine }
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            Write-Host "No 'What's New' section found for $version in WhatsNew.md; falling back to a changelog link."
            $notes = @(
              "# FindRomCover $version — What's New",
              '',
              "See [WhatsNew.md](https://github.com/${{ github.repository }}/blob/$tag/WhatsNew.md) for the full changelog.",
              '',
              '## Download',
              '',
              "- ``${tag}_win-x64.zip`` — Windows x64",
              "- ``${tag}_win-arm64.zip`` — Windows ARM64",
              "- ``${tag}_linux-x64.zip`` — Linux x64",
              "- ``${tag}_linux-arm64.zip`` — Linux ARM64",
              "- ``${tag}_osx-arm64.zip`` — macOS Apple Silicon"
            ) -join [Environment]::NewLine
          }
          else {
            Write-Host "Release notes embedded from the What's New section for $version."
          }
          Set-Content -LiteralPath 'NOTES.md' -Value $notes -Encoding UTF8NoBOM
          Get-ChildItem -LiteralPath 'assets' -Force |
            Format-Table Name, Length -AutoSize |
            Out-String -Width 200 |
            Write-Host

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ needs.validate.outputs.tag }}' \
            --title '${{ needs.validate.outputs.tag }}' \
            --notes-file NOTES.md \
            assets/*.zip
